name: Secure CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  secure-build:
    name: Security Scan, Build and Publish
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch complete Git history
        run: |
          git fetch --all --tags --prune
          git log --oneline --all -10


      # --------------------------------------------------
      # 2. Node
      # --------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          package-manager-cache: false


      # --------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------

      - name: Install backend dependencies
        working-directory: ./apps/backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: ./apps/frontend
        run: npm ci


      # --------------------------------------------------
      # 4. Secret scanning
      # --------------------------------------------------

      - name: Gitleaks - Secret Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # --------------------------------------------------
      # 5. Software Composition Analysis
      # --------------------------------------------------

      - name: Backend dependency scan
        working-directory: ./apps/backend
        run: npm audit --audit-level=high

      - name: Frontend dependency scan
        working-directory: ./apps/frontend
        run: npm audit --audit-level=high


      # --------------------------------------------------
      # 6. SAST
      # --------------------------------------------------

      - name: Install Semgrep
        run: python3 -m pip install semgrep

      - name: Semgrep SAST scan
        run: |
          semgrep scan \
            --config=auto \
            --error \
            --metrics=off \
            apps/backend/src \
            apps/frontend/src


      # --------------------------------------------------
      # 7. Application build
      # --------------------------------------------------

      - name: Build backend
        working-directory: apps/backend
        run: npm run build

      - name: Build frontend
        working-directory: apps/frontend
        run: npm run build


      # --------------------------------------------------
      # 8. Docker build
      # --------------------------------------------------

      - name: Build container image
        run: |
          docker build \
            -t secure-blog:${{ github.sha }} \
            .


      # --------------------------------------------------
      # 9. Container vulnerability scan
      # --------------------------------------------------

      - name: Trivy container scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: secure-blog:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"


      # --------------------------------------------------
      # 10. Prepare GHCR image name
      # --------------------------------------------------

      - name: Prepare container registry name
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"


      # --------------------------------------------------
      # 11. Login to GitHub Container Registry
      # --------------------------------------------------

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # --------------------------------------------------
      # 12. Publish immutable artifact
      # --------------------------------------------------

      - name: Push container image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag \
            secure-blog:${{ github.sha }} \
            $IMAGE_NAME:${{ github.sha }}

          docker push \
            $IMAGE_NAME:${{ github.sha }}


      # --------------------------------------------------
      # 13. Optional readable tag
      # --------------------------------------------------

      - name: Publish main tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag \
            secure-blog:${{ github.sha }} \
            $IMAGE_NAME:main

          docker push \
            $IMAGE_NAME:main